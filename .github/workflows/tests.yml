name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: python tests/test_all_features.py
      - run: python tests/test_audit_regressions.py
      - run: python tests/test_messaging_webhook.py
      - run: node tests/ui_smoke.js
      - run: node tests/pages_core.mjs
