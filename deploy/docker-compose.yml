  # db:
  #   image: postgres:16-alpine
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_DB: parceltrack
  #     POSTGRES_USER: parceltrack
  #     POSTGRES_PASSWORD: change-me
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data
  #   environment line in parceldesk service:
  #     DATABASE_URL: postgresql+psycopg://parceltrack:change-me@db:5432/parceltrack
