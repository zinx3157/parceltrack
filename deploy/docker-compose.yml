services:
  parceldesk:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: parceldesk
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: sqlite:////data/parceltrack.db
      HOST: 0.0.0.0
      PORT: "8000"
    ports:
      - "8000:8000"
    volumes:
      - ../data:/data

  # Optional: PostgreSQL instead of SQLite.
  # 1) uncomment the db service, 2) set DATABASE_URL below to use it,
  # 3) pip install psycopg[binary] inside the image.
